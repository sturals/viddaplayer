<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIDAA TV Player — Пульт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
        }

        .status.ready {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status.sending {
            background: rgba(234, 179, 8, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .status.sent {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .select-input, .url-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
        }

        .url-input {
            min-height: 100px;
            font-family: 'SF Mono', 'Menlo', monospace;
            resize: vertical;
            line-height: 1.4;
            word-break: break-all;
        }

        .select-input:focus, .url-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .url-input::placeholder {
            color: #475569;
        }

        .btn-send {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-send:active {
            transform: scale(0.97);
        }

        .btn-send.success {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.4);
        }

        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .history-section h3 {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .history-item {
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: monospace;
            color: #94a3b8;
            word-break: break-all;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .history-item:active {
            border-color: #3b82f6;
            color: #60a5fa;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 4px;
        }
    </style>
    <!-- PeerJS for Vercel Serverless Remote -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>📺 VIDAA TV Player — Пульт</h1>
            <p>Вставьте любую длинную ссылку на видео и отправьте её на ТВ</p>
        </div>

        <div id="status" class="status ready">
            <span id="status-text">🟢 Готов к отправке на ТВ</span>
        </div>

        <div class="input-group" id="tv-code-group">
            <label for="tv-code">Код телевизора (из QR-ссылки):</label>
            <input type="text" id="tv-code" class="url-input" placeholder="Например: tv_1234" autocomplete="off" />
        </div>

        <div class="input-group">
            <label for="url">Ссылка на видео (.m3u8, .mp4, .webm)</label>
            <textarea id="url" class="url-input" placeholder="Вставьте ссылку https://..." rows="3"></textarea>
        </div>

        <button id="btn-send" class="btn-send">
            <span>📡</span>
            <span id="btn-text">Отправить на ТВ</span>
        </button>

        <div class="remote-controls" style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btn-remote-pause" class="btn-send" style="background: #475569; flex: 1; padding: 10px; font-size: 0.95rem;">⏯ Пауза/Плей</button>
            <button id="btn-remote-stop" class="btn-send" style="background: #ef4444; flex: 1; padding: 10px; font-size: 0.95rem;">⏹ Стоп</button>
        </div>

        <div id="history-section" class="history-section" style="display: none;">
            <h3>История отправленных ссылок:</h3>
            <div id="history-list"></div>
        </div>

        <div class="footer">
            Ссылка передаётся моментально напрямую через WebRTC (PeerJS)
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const urlTvParam = params.get('tv');

        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const urlInput = document.getElementById('url');
        const btnSend = document.getElementById('btn-send');
        const btnTextEl = document.getElementById('btn-text');
        const historySection = document.getElementById('history-section');
        const historyList = document.getElementById('history-list');
        const tvCodeInput = document.getElementById('tv-code');
        const btnPause = document.getElementById('btn-remote-pause');
        const btnStop = document.getElementById('btn-remote-stop');

        let sentHistory = JSON.parse(localStorage.getItem('remote_history') || '[]');
        renderHistory();

        let peer = null;
        let tvConnection = null;

        if (urlTvParam) {
            tvCodeInput.value = urlTvParam;
            tvCodeInput.disabled = true;
            initPeer();
        } else {
            setStatus('error', '⚠️ Введите код ТВ (например: tv_1234) и нажмите отправить.');
        }

        btnSend.addEventListener('click', () => {
            if (!peer && tvCodeInput.value.trim()) {
                initPeer();
            } else if (tvConnection && tvConnection.open) {
                sendUrlToTV();
            } else {
                initPeer();
            }
        });

        function initPeer() {
            const tvCode = tvCodeInput.value.trim();
            if (!tvCode) {
                setStatus('error', '⚠️ Введите код телевизора!');
                return;
            }

            setStatus('ready', '🔄 Подключение к ТВ...');
            btnSend.disabled = true;

            if (peer) peer.destroy();
            
            peer = new Peer(); // Create phone peer

            peer.on('open', (id) => {
                const targetPeerId = 'vidaatv-' + tvCode;
                console.log('Connecting to TV:', targetPeerId);
                tvConnection = peer.connect(targetPeerId, { reliable: true });

                tvConnection.on('open', () => {
                    setStatus('ready', '🟢 Успешно подключено к ТВ!');
                    btnSend.disabled = false;
                    sendUrlToTV(); // auto-send if url is ready
                });

                tvConnection.on('close', () => {
                    setStatus('error', '❌ Связь с ТВ потеряна.');
                    btnSend.disabled = false;
                    peer.destroy();
                    peer = null;
                });
                
                tvConnection.on('error', (err) => {
                    setStatus('error', '❌ Ошибка соединения: ' + err);
                    btnSend.disabled = false;
                });
            });

            peer.on('error', (err) => {
                setStatus('error', '❌ Ошибка сети: ' + err.type);
                btnSend.disabled = false;
            });
        }

        function sendUrlToTV() {
            const url = urlInput.value.trim();
            if (!url) return;

            if (!tvConnection || !tvConnection.open) {
                initPeer();
                return;
            }

            try {
                tvConnection.send({ url: url });
                
                setStatus('ready', '✅ Ссылка успешно отправлена!');
                btnSend.classList.add('success');
                btnTextEl.textContent = 'Отправлено!';

                saveToHistory(url);

                setTimeout(() => {
                    btnSend.classList.remove('success');
                    btnTextEl.textContent = 'Отправить на ТВ';
                    setStatus('ready', '🟢 Готов к отправке на ТВ');
                }, 2000);
            } catch (e) {
                setStatus('error', '❌ Ошибка отправки: ' + e.message);
            }
        }
        
        btnPause.addEventListener('click', () => {
            if (tvConnection && tvConnection.open) {
                tvConnection.send({ command: 'play_pause' });
                setStatus('ready', '⏯ Команда паузы отправлена');
            } else {
                setStatus('error', '❌ Нет подключения к ТВ');
            }
        });

        btnStop.addEventListener('click', () => {
            if (tvConnection && tvConnection.open) {
                tvConnection.send({ command: 'stop' });
                setStatus('ready', '⏹ Команда остановки отправлена');
            } else {
                setStatus('error', '❌ Нет подключения к ТВ');
            }
        });

        function saveToHistory(url) {
            sentHistory = sentHistory.filter(h => h !== url);
            sentHistory.unshift(url);
            if (sentHistory.length > 5) sentHistory.pop();
            localStorage.setItem('remote_history', JSON.stringify(sentHistory));
            renderHistory();
        }

        function setStatus(type, text) {
            statusEl.className = 'status ' + type;
            statusText.textContent = text;
        }

        function renderHistory() {
            if (sentHistory.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'flex';
            historyList.innerHTML = '';
            sentHistory.forEach(url => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = url;
                div.addEventListener('click', () => {
                    urlInput.value = url;
                    sendUrlToTV();
                });
                historyList.appendChild(div);
            });
        }
    </script>
</body>
</html>
